<!doctype html>
<!-- Canvas 2D template for tools/web-engine/render_web.py: copy this folder into
     clips/<project>/, draw everything from t in draw(t), and render with
     python tools/web-engine/render_web.py <page_folder> --out clip.mp4 --end 4 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0d1017; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
const W = innerWidth, H = innerHeight;
const canvas = document.getElementById("c");
canvas.width = W;
canvas.height = H;
const g = canvas.getContext("2d");

const clamp = (x) => Math.min(1, Math.max(0, x));
const easeOut = (x) => 1 - (1 - clamp(x)) ** 3;
const span = (t, a, b) => clamp((t - a) / (b - a));

function draw(t) {
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#0d1017");
  bg.addColorStop(1, "#1b2233");
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  // A row of dots that rise in turn, then a title that slides in.
  for (let i = 0; i < 7; i++) {
    const k = easeOut(span(t, 0.2 + i * 0.12, 0.9 + i * 0.12));
    g.globalAlpha = k;
    g.fillStyle = `hsl(${200 + i * 18} 80% 62%)`;
    g.beginPath();
    g.arc(W * (0.2 + i * 0.1), H * 0.62 - 90 * k, 26, 0, Math.PI * 2);
    g.fill();
  }
  const k = easeOut(span(t, 1.2, 2.0));
  g.globalAlpha = k;
  g.fillStyle = "#f4f6fb";
  g.font = `700 ${Math.round(H * 0.09)}px "Segoe UI", sans-serif`;
  g.textAlign = "center";
  g.fillText("Canvas 2D clip", W / 2 + (1 - k) * 60, H * 0.36);
  g.globalAlpha = 1;
}

window.renderAt = async (t) => {
  draw(t);
  // Let the compositor present the frame before it is captured.
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return "ok";
};
window.__info = { engine: "canvas2d", width: W, height: H };
window.__ready = true;
</script>
</body>
</html>
