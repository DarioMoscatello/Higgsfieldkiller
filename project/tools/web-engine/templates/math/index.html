<!doctype html>
<!-- Math template for tools/web-engine/render_web.py: draws formula.svg glyph by glyph,
     then fills it. Replace formula.svg with your own SVG formula (for example from a TeX-to-SVG tool),
     and render with
       python tools/web-engine/render_web.py <page_folder> --out clip.mp4 --end 4 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0f1320; overflow: hidden; width: 100vw; height: 100vh; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  #stage svg { width: 70vw; height: auto; max-height: 60vh; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
const clamp = (x) => Math.min(1, Math.max(0, x));
const easeInOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);

try {
  const text = await (await fetch("formula.svg")).text();
  document.getElementById("stage").innerHTML = text;
  // Glyphs are paths; fraction bars and root lines are rects. Both, in reading order.
  const parts = [...document.querySelectorAll("#stage path, #stage rect")].map((el) => {
    if (el.tagName === "rect") {
      el.style.transformBox = "fill-box";
      el.style.transformOrigin = "left center";
      return { el, length: 0 };
    }
    const length = el.getTotalLength();
    el.style.strokeDasharray = `${length}`;
    el.style.strokeWidth = "22";
    el.style.strokeLinejoin = "round";
    return { el, length };
  });
  // Parts start 70 ms apart; each draws (or grows) over 0.6 s, then fills over 0.3 s.
  window.renderAt = async (t) => {
    parts.forEach(({ el, length }, i) => {
      const draw = easeInOut(clamp((t - 0.2 - i * 0.07) / 0.6));
      const fill = clamp((t - 0.6 - i * 0.07) / 0.3);
      if (el.tagName === "rect") {
        el.style.transform = `scaleX(${draw})`;
        return;
      }
      el.style.strokeDashoffset = `${length * (1 - draw)}`;
      el.style.fillOpacity = `${fill}`;
      el.style.strokeOpacity = `${1 - fill * 0.9}`;
    });
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    return "ok";
  };
  window.__info = { engine: "math", parts: parts.length };
  window.__ready = true;
} catch (err) {
  window.__error = String(err);
}
</script>
</body>
</html>
